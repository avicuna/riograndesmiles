# /services/bridges/ and /es/services/bridges/
order: 4
icon: "bridges"
en:
  title: "Bridges"
  summary: "Replace missing teeth by anchoring to adjacent healthy teeth."
  description: "A dental bridge is used to replace one or more missing teeth by anchoring them to adjacent teeth for support."
  expect: "A dental bridge typically requires two visits. During the first appointment, Dr. Vicuña will prepare the adjacent teeth and take impressions for your custom bridge. A temporary bridge protects your teeth while the permanent one is crafted. At the second visit, your permanent bridge is placed and adjusted for a comfortable, secure fit."
  benefits:
    - "Permanently replaces one or more missing teeth"
    - "Restores your ability to chew and speak normally"
    - "Maintains the natural shape of your face"
    - "Prevents remaining teeth from drifting out of position"
es:
  title: "Puentes dentales"
  summary: "Reemplace dientes faltantes con un puente fijado a los dientes sanos vecinos."
  description: "Un puente dental reemplaza uno o más dientes faltantes y se apoya en los dientes adyacentes."
  expect: "Un puente dental normalmente requiere dos visitas. En la primera cita, el Dr. Vicuña preparará los dientes adyacentes y tomará impresiones para su puente hecho a la medida. Un puente temporal protege sus dientes mientras se fabrica el definitivo. En la segunda visita, se coloca y ajusta el puente definitivo para que quede cómodo y firme."
  benefits:
    - "Reemplaza de forma permanente uno o más dientes faltantes"
    - "Le permite volver a masticar y hablar con normalidad"
    - "Mantiene la forma natural de su rostro"
    - "Evita que los demás dientes se muevan de su lugar"
